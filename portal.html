<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AEC STUDENT PORTAL - CGPA &amp; Attendance Predictor</title>
  <link id="circleFavicon" rel="icon" href="icon.jpeg" type="image/jpeg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="portal-page">
  <!-- Blurred clg.png Background -->
  <div class="portal-bg-blur" aria-hidden="true"></div>

  <div class="container">
    <!-- Single Top Bar: AEC STUDENT PORTAL & Reset Data -->
    <header class="top-bar">
      <a href="index.html" class="home-brand" title="Back to Home">
        <img src="icon.jpeg" alt="AEC Student Portal Icon" class="home-icon-img" />
        <div>
          <span class="brand-text">AEC STUDENT PORTAL</span>
          <span class="brand-subtext">Annapoorana Engineering College</span>
        </div>
      </a>
      <button id="clearAllBtn" class="secondary-btn" type="button">Reset Data</button>
    </header>

    <!-- Equal-Size 2-Column Portal Grid -->
    <div class="portal-grid">
      <!-- GPA / CGPA Section -->
      <section class="card" id="gpa-section">
        <div class="card-header">
          <span class="gpa-icon-box" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 10L12 5 2 10l10 5 10-5z" />
              <path d="M6 12v5c0 1.66 2.69 3 6 3s6-1.34 6-3v-5" />
            </svg>
          </span>
          <h2>GPA / CGPA Calculator</h2>
        </div>

        <div class="row-inputs">
          <input type="text" id="subjectName" placeholder="Subject (e.g., DBMS)" />
          <input type="number" id="credits" placeholder="Credits (e.g., 4)" min="0.5" max="10" step="0.5" />
          <select id="gradePoint">
            <option value="10">O (10)</option>
            <option value="9">A+ (9)</option>
            <option value="8">A (8)</option>
            <option value="7">B+ (7)</option>
            <option value="6">B (6)</option>
            <option value="5">C (5)</option>
          </select>
          <button id="addSubjectBtn" type="button">Add</button>
        </div>

        <ul id="subjectList" class="list"></ul>

        <div class="result-box" id="gpaResult">
          Current GPA: <strong>0.00</strong> | Total Credits: <strong>0</strong>
        </div>
      </section>

      <!-- Attendance Predictor Section -->
      <section class="card" id="attendance-section">
        <div class="card-header">
          <span class="attendance-icon-box" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="17" rx="2" />
              <line x1="8" y1="2" x2="8" y2="6" />
              <line x1="16" y1="2" x2="16" y2="6" />
              <line x1="3" y1="10" x2="21" y2="10" />
              <polyline points="9 15 11 17 15 13" />
            </svg>
          </span>
          <h2>Attendance Predictor (75% Target)</h2>
        </div>

        <div class="row-inputs">
          <input type="number" id="totalClasses" placeholder="Total Classes Held" min="1" />
          <input type="number" id="attendedClasses" placeholder="Classes Attended" min="0" />
          <button id="predictBtn" type="button">Predict</button>
        </div>

        <div class="result-box" id="attendanceResult">
          Enter total and attended classes to see your prediction.
        </div>
      </section>
    </div>
  </div>

  <script>
    (function makeRoundFavicon() {
      const link = document.getElementById("circleFavicon");
      if (!link) return;
      const img = new Image();
      img.onload = function () {
        const size = 64;
        const canvas = document.createElement("canvas");
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext("2d");
        ctx.beginPath();
        ctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
        ctx.closePath();
        ctx.clip();
        ctx.drawImage(img, 0, 0, size, size);
        link.href = canvas.toDataURL("image/png");
      };
      img.src = "icon.jpeg";
    })();
  </script>
  <script src="script.js"></script>
</body>
</html>
